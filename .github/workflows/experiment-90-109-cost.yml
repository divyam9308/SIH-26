name: Experiment 90-109 Cost comparison
on:
  pull_request:
    paths:
      - 'backend/app/ml/experiments/**'
      - 'tests/test_exp90_109_contract.py'
      - '.github/workflows/experiment-90-109-cost.yml'
  workflow_dispatch:
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        end: [2019, 2021]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Contract tests
        run: python -m py_compile backend/app/ml/experiments/post_u1_cost_common.py backend/app/ml/experiments/run_exp90_109.py backend/app/ml/experiments/adapter_exp*.py && PYTHONPATH=. pytest -q tests/test_exp90_109_contract.py
      - name: Run isolated comparison
        run: PYTHONPATH=. python -m backend.app.ml.experiments.run_exp90_109 --end ${{ matrix.end }} --output audit_outputs/exp_${{ matrix.end }}.json
      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          end=${{ matrix.end }}
          x=json.loads(Path(f'audit_outputs/exp_{end}.json').read_text())
          expected={2019:(949,14847),2021:(721,11200)}[end]
          assert x['scope']=='cost' and x['promotion_allowed'] is False
          assert x['holdout_used_for_selection'] is False and x['delay_predictions_identical'] is True
          assert (x['comparison_test_projects'],x['comparison_test_snapshots'])==expected
          assert x['execution_verdict']=='EXECUTION VALID'
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp90-109-${{ matrix.end }}
          path: audit_outputs/exp_${{ matrix.end }}.json

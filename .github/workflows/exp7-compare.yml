name: Experiment 7 hierarchical residual comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/hierarchical_residual_priors_exp7.py'
      - 'backend/app/ml/experiments/runtime_exp7.py'
      - 'backend/app/ml/experiments/adapter_exp7.py'
      - 'scripts/run_fast_current_experiment.py'
      - 'tests/test_exp7_hierarchical_priors.py'
      - '.github/workflows/exp7-compare.yml'
      - 'backend/app/ml/production_cost_baseline.py'
      - 'backend/app/ml/monthly_lifecycle.py'
      - 'backend/app/ml/monthly_training.py'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - training_start: 2001
            training_end: 2019
            test_end: 2025
            window: 2001_2019
          - training_start: 2001
            training_end: 2021
            test_end: 2025
            window: 2001_2021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate sources
        run: python -m compileall -q backend scripts tests
      - name: Run Experiment 7 tests
        run: PYTHONPATH=. pytest -q tests/test_exp7_hierarchical_priors.py
      - name: Run exact current production vs Experiment 7
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_fast_current_experiment.py \
            --experiment exp_7 \
            --start ${{ matrix.training_start }} \
            --end ${{ matrix.training_end }} \
            --test-end ${{ matrix.test_end }} \
            --output audit_outputs/exp7_compare_${{ matrix.training_start }}_${{ matrix.training_end }}.json
      - name: Print scientific verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          start='${{ matrix.training_start }}'; end='${{ matrix.training_end }}'
          r=json.loads((Path('audit_outputs')/f'exp7_compare_{start}_{end}.json').read_text())
          m=r['overall_comparison']
          print(f'WINDOW={start}_{end}')
          print(f"PRODUCTION_COST_MAE={m['production_cost_mae']:.6f}")
          print(f"EXP7_COST_MAE={m['experiment_cost_mae']:.6f}")
          print(f"COST_IMPROVEMENT_PERCENT={m['cost_improvement_percentage']:.6f}")
          print(f"PRODUCTION_DELAY_MAE_RETAINED={m.get('production_delay_mae')}")
          print('DELAY_POLICY=production_retained')
          verdict='PROMOTION CANDIDATE' if m['cost_improvement_percentage'] > 0 else 'REGRESSION / DO NOT PROMOTE'
          print(f'VERDICT={verdict}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp7-results-${{ matrix.window }}
          path: audit_outputs/exp7_compare_${{ matrix.training_start }}_${{ matrix.training_end }}.json
          if-no-files-found: warn

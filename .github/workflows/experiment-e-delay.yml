name: Experiment E Delay comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/experiment_e_delay_weather_exposure.py'
      - 'data/external/imd_state_weather_monthly.csv'
      - 'tests/test_experiment_e_delay_weather_exposure.py'
      - '.github/workflows/experiment-e-delay.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
      POST_EXP113_OOF_WORKERS: '2'
      POST_EXP113_THREADS_PER_WORKER: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Focused tests
        run: |
          python -m py_compile backend/app/ml/experiments/experiment_e_delay_weather_exposure.py
          pytest -q tests/test_experiment_e_delay_weather_exposure.py
      - name: Run primary comparison or honest evidence-gap control
        run: |
          mkdir -p audit_outputs
          python -m backend.app.ml.experiments.experiment_e_delay_weather_exposure --end 2021 --output audit_outputs/experiment_e_2001_2021.json
      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('audit_outputs/experiment_e_2001_2021.json').read_text())
          assert x['experiment_id']=='exp_e'
          assert (x['comparison_test_projects'],x['comparison_test_snapshots'])==(721,11200)
          assert x['cost_predictions_identical'] is True
          assert x['holdout_used_for_selection'] is False
          assert x['execution_verdict']=='EXECUTION VALID'
          if not x['details'].get('verified_external_data_available'):
              assert abs(float(x['experiment_delay_mae'])-float(x['production_delay_mae'])) < 1e-12
              assert x['scientific_verdict']=='DO NOT PROMOTE'
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-e-delay-2001-2021
          path: audit_outputs/experiment_e_2001_2021.json
          if-no-files-found: warn

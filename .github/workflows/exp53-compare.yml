name: Experiment 53 comparison - 2001-2021 only
on:
  pull_request:
    branches: [main]
    paths: ['backend/app/ml/experiments/nextgen_common.py','backend/app/ml/experiments/peer_pressure_cost_exp53.py','backend/app/ml/experiments/adapter_exp53.py','tests/test_exp53_nextgen.py','.github/workflows/exp53-compare.yml']
  workflow_dispatch:
jobs:
 compare:
  runs-on: ubuntu-latest
  timeout-minutes: 360
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12', cache: pip}
   - run: pip install -r requirements-dev.txt
   - run: python -m py_compile backend/app/ml/experiments/nextgen_common.py backend/app/ml/experiments/peer_pressure_cost_exp53.py backend/app/ml/experiments/adapter_exp53.py && PYTHONPATH=. pytest -q tests/test_experiment_prediction_ledger.py tests/test_exp53_nextgen.py
   - env: {PYTHONPATH: '${{ github.workspace }}'}
     run: python -m backend.app.ml.experiments.peer_pressure_cost_exp53 --start 2001 --end 2021 --test-end 2025 --output audit_outputs/exp53_2001_2021.json
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: exp53-2001-2021
      path: |
       audit_outputs/exp53_2001_2021.json
       models/monthly_lifecycle/experiments/exp_53/2001_2021/**/*
      if-no-files-found: error

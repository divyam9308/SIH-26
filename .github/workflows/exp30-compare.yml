name: Experiment 30 comparison
on:
  pull_request:
    branches: [main]
    paths: ['backend/app/ml/experiments/recency_weighted_exp30.py','backend/app/ml/experiments/adapter_exp30.py','scripts/run_fast_current_experiment.py','tests/test_exp30_recency_weighted.py','.github/workflows/exp30-compare.yml']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 2001, end: 2019}
          - {start: 2001, end: 2021}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q tests/test_exp30_recency_weighted.py
      - env: {PYTHONPATH: '${{ github.workspace }}'}
        run: python scripts/run_fast_current_experiment.py --experiment exp_30 --start ${{ matrix.start }} --end ${{ matrix.end }} --test-end 2025 --output audit_outputs/exp30_${{ matrix.start }}_${{ matrix.end }}.json
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s='${{ matrix.start }}'; e='${{ matrix.end }}'; m=json.loads((Path('audit_outputs')/f'exp30_{s}_{e}.json').read_text())['overall_comparison']
          print(m)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'exp30-${{ matrix.start }}-${{ matrix.end }}', path: 'audit_outputs/exp30_${{ matrix.start }}_${{ matrix.end }}.json', if-no-files-found: warn}

name: Delay remaining-time tail benefit gate experiment
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/post_exp113_component_common.py'
      - 'backend/app/ml/experiments/exp_delay_remaining_tail_benefit_gate.py'
      - 'tests/test_exp_delay_remaining_tail_benefit_gate.py'
      - '.github/workflows/exp-delay-remaining-tail-benefit-gate.yml'
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  oof:
    name: OOF ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2016, 2017, 2018, 2019, 2020, 2021]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build exact strict-forward Exp113 component fold
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: >-
          python -m backend.app.ml.experiments.exp_delay_remaining_tail_benefit_gate
          --build-oof-year ${{ matrix.year }}
          --oof-output audit_oof/delay-oof-${{ matrix.year }}.pkl
      - uses: actions/upload-artifact@v4
        with:
          name: delay-oof-${{ matrix.year }}
          path: audit_oof/delay-oof-${{ matrix.year }}.pkl
          if-no-files-found: error

  compare:
    name: full 2001-2021 comparison
    needs: oof
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Focused tests
        run: pytest -q tests/test_exp_delay_remaining_tail_benefit_gate.py
      - uses: actions/download-artifact@v4
        with:
          pattern: delay-oof-*
          path: audit_oof
          merge-multiple: true
      - name: Full leakage-safe comparison
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: >-
          python -m backend.app.ml.experiments.exp_delay_remaining_tail_benefit_gate
          --oof-dir audit_oof
          --output audit_outputs/exp_delay_remaining_tail_benefit_gate.json
      - name: Show result
        if: always()
        run: test ! -f audit_outputs/exp_delay_remaining_tail_benefit_gate.json || cat audit_outputs/exp_delay_remaining_tail_benefit_gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-delay-remaining-tail-benefit-gate
          path: audit_outputs/exp_delay_remaining_tail_benefit_gate.json
          if-no-files-found: warn

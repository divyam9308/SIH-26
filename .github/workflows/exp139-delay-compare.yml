name: Exp139 Delay 2001-2022

on:
  pull_request:
    branches: [main]

jobs:
  unit:
    if: github.head_ref == 'experiment-139-sector-stratified-delay-cap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile backend/app/ml/experiments/exp139_sector_stratified_delay.py scripts/run_exp139_delay.py
      - run: pytest tests/test_exp139_sector_stratified_delay.py

  oof:
    if: github.head_ref == 'experiment-139-sector-stratified-delay-cap'
    name: OOF ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2017, 2018, 2019, 2020, 2021, 2022]
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build exact strict-forward production Delay OOF fold
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: >-
          python scripts/run_exp139_delay.py
          --oof-year ${{ matrix.year }}
          --output audit_oof/delay-oof-${{ matrix.year }}.pkl
      - uses: actions/upload-artifact@v4
        with:
          name: exp139-delay-oof-${{ matrix.year }}
          path: audit_oof/delay-oof-${{ matrix.year }}.pkl
          if-no-files-found: error
          retention-days: 7

  compare:
    if: github.head_ref == 'experiment-139-sector-stratified-delay-cap'
    name: full 2001-2022 comparison
    needs: [unit, oof]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: exp139-delay-oof-*
          path: audit_oof
          merge-multiple: true
      - name: Verify all strict OOF shards arrived
        run: |
          test -f audit_oof/delay-oof-2017.pkl
          test -f audit_oof/delay-oof-2018.pkl
          test -f audit_oof/delay-oof-2019.pkl
          test -f audit_oof/delay-oof-2020.pkl
          test -f audit_oof/delay-oof-2021.pkl
          test -f audit_oof/delay-oof-2022.pkl
      - name: Run Exp139 2001-2022 -> 2023-2025 comparison
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: >-
          python scripts/run_exp139_delay.py
          --end 2022
          --oof-dir audit_oof
          --output audit_outputs/exp139_2001_2022.json
      - name: Show result
        if: always()
        run: test ! -f audit_outputs/exp139_2001_2022.json || cat audit_outputs/exp139_2001_2022.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp139-2001-2022
          path: audit_outputs/exp139_2001_2022.json
          if-no-files-found: warn

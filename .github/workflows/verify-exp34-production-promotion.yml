name: Verify Exp34 regression baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/production_delay_baseline.py'
      - 'tests/test_exp34_production_promotion.py'
      - 'tests/test_exp34_path_oof_delay.py'
      - '.github/workflows/verify-exp34-production-promotion.yml'
  workflow_dispatch:

jobs:
  verify-exp34-2001-2021:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Exp34 contract tests
        run: PYTHONPATH=. pytest -q tests/test_exp34_production_promotion.py tests/test_exp34_path_oof_delay.py
      - name: Reproduce the frozen Exp34 regression baseline directly
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.app.ml.monthly_lifecycle import build_training_dataset
          from backend.app.ml.production_delay_baseline import train_window_with_promoted_cost_and_delay

          data, identity = build_training_dataset()
          result = train_window_with_promoted_cost_and_delay(
              2001,
              2021,
              2025,
              data=data,
              identity=identity,
          )
          assert result['metadata']['production_cost_baseline'] == 'exp12_trajectory_v3_cost_only'
          assert result['metadata']['production_delay_baseline'] == 'exp34_path_oof_ensemble_v1'
          assert result['metadata']['promoted_from_experiment'] == 'exp_12'
          assert result['metadata']['promoted_delay_from_experiment'] == 'exp_34'

          cost_mae = float(result['lifecycle']['metrics']['cost']['MAE'])
          delay_mae_721 = float(result['lifecycle']['metrics']['delay']['MAE'])
          contract = result['metadata']['delay_evaluation_contract']
          assert int(contract['test_projects']) == 721, contract
          assert int(contract['test_snapshots']) == 11200, contract
          assert int(contract['full_holdout_projects']) == 728, contract
          delay_mae_728 = float(contract['full_holdout_delay_metrics']['MAE'])

          assert abs(cost_mae - 26.872) <= 0.001, cost_mae
          assert abs(delay_mae_721 - 501.303) <= 0.001, delay_mae_721
          assert abs(delay_mae_728 - 503.555) <= 0.001, delay_mae_728

          metadata = json.loads(Path('models/monthly_lifecycle/2001_2021/metadata.json').read_text())
          weights = metadata['delay_blend_weights']
          assert weights == {'extra_trees': 0.2, 'lightgbm': 0.6, 'xgboost': 0.2}, weights
          print(f'EXP34_REGRESSION_COST_MAE_721={cost_mae:.6f}')
          print(f'EXP34_REGRESSION_DELAY_MAE_721={delay_mae_721:.6f}')
          print(f'EXP34_REGRESSION_DELAY_MAE_FULL_728={delay_mae_728:.6f}')
          print('EXP34_REGRESSION_BASELINE=VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp34-regression-2001-2021
          path: |
            models/monthly_lifecycle/2001_2021/metadata.json
            models/monthly_lifecycle/2001_2021/evaluation_results.json
          if-no-files-found: warn

name: Exp120-129 Delay comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/exp12*_delay.py'
      - 'backend/app/ml/experiments/post_exp113_delay_common.py'
      - 'backend/app/ml/experiments/run_exp120_129.py'
      - 'backend/app/ml/production_exp105_exp113_fast.py'
      - '.github/workflows/exp120-129-delay-compare.yml'
  workflow_dispatch:

jobs:
  oof:
    if: github.head_ref == 'experiment-126-reporting-cadence'
    name: OOF ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2016, 2017, 2018, 2019, 2020, 2021]
    env:
      PYTHONUNBUFFERED: '1'
      SIH_FOLD_JOBS: '3'
      SIH_MODEL_THREADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: >-
          python -m py_compile
          backend/app/ml/production_exp105_exp113_fast.py
          backend/app/ml/experiments/post_exp113_delay_common.py
          backend/app/ml/experiments/run_exp120_129.py
          backend/app/ml/experiments/exp126_delay.py
      - name: Build exact strict-forward production Delay OOF fold
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: >-
          python -m backend.app.ml.experiments.run_exp120_129
          --exp 126
          --oof-year ${{ matrix.year }}
          --output audit_oof/delay-oof-${{ matrix.year }}.pkl
      - uses: actions/upload-artifact@v4
        with:
          name: exp126-delay-oof-${{ matrix.year }}
          path: audit_oof/delay-oof-${{ matrix.year }}.pkl
          if-no-files-found: error
          retention-days: 7

  compare:
    if: github.head_ref == 'experiment-126-reporting-cadence'
    name: compare (2021)
    needs: oof
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      SIH_FOLD_JOBS: '3'
      SIH_MODEL_THREADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: >-
          python -m py_compile
          backend/app/ml/production_exp105_exp113_fast.py
          backend/app/ml/experiments/post_exp113_delay_common.py
          backend/app/ml/experiments/run_exp120_129.py
          backend/app/ml/experiments/exp126_delay.py
      - uses: actions/download-artifact@v4
        with:
          pattern: exp126-delay-oof-*
          path: audit_oof
          merge-multiple: true
      - name: Verify all strict OOF shards arrived
        run: |
          test -f audit_oof/delay-oof-2016.pkl
          test -f audit_oof/delay-oof-2017.pkl
          test -f audit_oof/delay-oof-2018.pkl
          test -f audit_oof/delay-oof-2019.pkl
          test -f audit_oof/delay-oof-2020.pkl
          test -f audit_oof/delay-oof-2021.pkl
      - name: Fresh production-vs-experiment comparison from exact OOF shards
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: >-
          python -m backend.app.ml.experiments.run_exp120_129
          --exp 126
          --end 2021
          --oof-dir audit_oof
          --output audit_outputs/exp126_2001_2021.json
      - name: Show result
        if: always()
        run: test ! -f audit_outputs/exp126_2001_2021.json || cat audit_outputs/exp126_2001_2021.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp126-2001-2021
          path: audit_outputs/exp126_2001_2021.json
          if-no-files-found: warn

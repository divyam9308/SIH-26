name: Experiment 29 comparison
on:
  pull_request:
    branches: [main]
    paths: ['backend/app/ml/experiments/path_dependence_exp29.py','backend/app/ml/experiments/adapter_exp29.py','scripts/run_fast_current_experiment.py','tests/test_exp29_path_dependence.py','.github/workflows/exp29-compare.yml']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 2001, end: 2019}
          - {start: 2001, end: 2021}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q tests/test_exp29_path_dependence.py
      - name: Compare exact current production vs Experiment 29
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: python scripts/run_fast_current_experiment.py --experiment exp_29 --start ${{ matrix.start }} --end ${{ matrix.end }} --test-end 2025 --output audit_outputs/exp29_${{ matrix.start }}_${{ matrix.end }}.json
      - name: Print scientific verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s='${{ matrix.start }}'; e='${{ matrix.end }}'; m=json.loads((Path('audit_outputs')/f'exp29_{s}_{e}.json').read_text())['overall_comparison']
          print('WINDOW=',s,e); print('PRODUCTION_COST_MAE=',m.get('production_cost_mae')); print('EXPERIMENT_COST_MAE=',m.get('experiment_cost_mae')); print('COST_IMPROVEMENT_PERCENT=',m.get('cost_improvement_percentage')); print('PRODUCTION_DELAY_MAE=',m.get('production_delay_mae')); print('EXPERIMENT_DELAY_MAE=',m.get('experiment_delay_mae')); print('DELAY_IMPROVEMENT_PERCENT=',m.get('delay_improvement_percentage')); print('VERDICT=',m.get('decision'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'exp29-${{ matrix.start }}-${{ matrix.end }}', path: 'audit_outputs/exp29_${{ matrix.start }}_${{ matrix.end }}.json', if-no-files-found: warn}

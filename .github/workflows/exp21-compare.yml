name: Experiment 21 scope semantics comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/scope_semantics_exp21.py'
      - 'backend/app/ml/experiments/adapter_exp21.py'
      - 'tests/test_exp21_scope_semantics.py'
      - '.github/workflows/exp21-compare.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 2001
            end: 2019
          - start: 2001
            end: 2021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Experiment 21 tests
        run: PYTHONPATH=. pytest -q tests/test_exp21_scope_semantics.py
      - name: Run production vs Experiment 21
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_ml_experiment.py \
            --callable backend.app.ml.experiments.adapter_exp21:run_experiment \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --test-end 2025
      - name: Print scientific verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          start='${{ matrix.start }}'; end='${{ matrix.end }}'
          r=json.loads((Path('reports/experiments/exp_21')/f'{start}_{end}'/'result.json').read_text())
          m=r['metrics']
          print(f'WINDOW={start}_{end}')
          print(f"PRODUCTION_COST_MAE={m['production_cost_mae']:.6f}")
          print(f"EXPERIMENT_COST_MAE={m['experiment_cost_mae']:.6f}")
          print(f"COST_IMPROVEMENT_PERCENT={m['cost_improvement_percentage']:.6f}")
          print(f"PRODUCTION_DELAY_MAE={m['production_delay_mae']:.6f}")
          print(f"EXPERIMENT_DELAY_MAE={m['experiment_delay_mae']:.6f}")
          print(f"DELAY_IMPROVEMENT_PERCENT={m['delay_improvement_percentage']:.6f}")
          print(f"VERDICT={r['decision']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp21-${{ matrix.start }}-${{ matrix.end }}
          path: reports/experiments/exp_21/${{ matrix.start }}_${{ matrix.end }}/**
          if-no-files-found: warn

name: Experiment F Cost comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/experiment_f_cost_remaining_to_complete.py'
      - 'tests/test_experiment_f_cost_remaining_to_complete.py'
      - '.github/workflows/experiment-f-cost.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Focused tests
        run: |
          python -m py_compile backend/app/ml/experiments/experiment_f_cost_remaining_to_complete.py
          pytest -q tests/test_experiment_f_cost_remaining_to_complete.py
      - name: Run primary comparison
        run: |
          mkdir -p audit_outputs
          python -m backend.app.ml.experiments.experiment_f_cost_remaining_to_complete --end 2021 --output audit_outputs/experiment_f_2001_2021.json
      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('audit_outputs/experiment_f_2001_2021.json').read_text())
          assert x['experiment_id']=='exp_f'
          assert (x['comparison_test_projects'],x['comparison_test_snapshots'])==(721,11200)
          assert x['delay_predictions_identical'] is True
          assert x['holdout_used_for_selection'] is False
          assert x['execution_verdict']=='EXECUTION VALID'
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-f-cost-2001-2021
          path: audit_outputs/experiment_f_2001_2021.json
          if-no-files-found: warn

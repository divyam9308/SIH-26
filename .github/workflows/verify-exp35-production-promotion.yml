name: Verify Exp32+Exp33 production promotion

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/production_exp35_baseline.py'
      - 'backend/app/ml/experiments/exp35_aft_residual_combo.py'
      - 'backend/app/services/lifecycle_retraining_service.py'
      - 'tests/test_exp35_production_promotion.py'
      - '.github/workflows/verify-exp35-production-promotion.yml'
  workflow_dispatch:

jobs:
  verify-production-2001-2021:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Production wrapper contract tests
        run: PYTHONPATH=. pytest -q tests/test_exp35_production_promotion.py tests/test_exp35_aft_residual_combo.py
      - name: Retrain selected production window and verify full 721-project promotion
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.app.services.lifecycle_retraining_service import retrain_lifecycle

          result = retrain_lifecycle(2001, 2021)
          assert result['window'] == '2001_2021', result['window']
          assert result['production_cost_baseline'] == 'exp12_plus_exp33_residual_v1'
          assert result['production_delay_baseline'] == 'exp32_aft_plus_exp33_residual_exp34_fallback_v1'
          assert result['promoted_from_experiment'] == 'exp_35'
          assert result['promoted_delay_from_experiment'] == 'exp_35'

          cost_mae = float(result['metrics']['cost_model']['MAE'])
          delay_mae = float(result['metrics']['delay_model']['MAE'])
          contract = result['metrics']['metadata']['delay_evaluation_contract']
          assert int(contract['test_projects']) == 721, contract
          assert int(contract['test_snapshots']) == 11200, contract
          assert contract['fallback_policy'].startswith('Exp34 production Delay'), contract
          assert int(contract['aft_eligible_projects']) <= 721, contract
          assert int(contract['aft_eligible_snapshots']) <= 11200, contract

          # The promotion trainer itself independently reproduces these baselines
          # before fitting/accepting Exp32+Exp33.
          previous_cost_mae = 26.872
          previous_delay_mae = 501.303
          assert cost_mae < previous_cost_mae, (cost_mae, previous_cost_mae)
          assert delay_mae < previous_delay_mae, (delay_mae, previous_delay_mae)

          metadata = json.loads(Path('models/monthly_lifecycle/2001_2021/metadata.json').read_text())
          assert metadata['production_cost_baseline'] == 'exp12_plus_exp33_residual_v1'
          assert metadata['production_delay_baseline'] == 'exp32_aft_plus_exp33_residual_exp34_fallback_v1'
          assert metadata['promoted_from_experiment'] == 'exp_35'
          assert metadata['promoted_delay_from_experiment'] == 'exp_35'
          assert metadata['risk_policy'] == 'existing_production_retained'
          assert metadata['delay_evaluation_contract']['test_projects'] == 721
          assert metadata['delay_evaluation_contract']['test_snapshots'] == 11200

          cost_gain = (previous_cost_mae - cost_mae) / previous_cost_mae * 100.0
          delay_gain = (previous_delay_mae - delay_mae) / previous_delay_mae * 100.0
          print(f'EXP32_EXP33_PRODUCTION_COST_MAE_721={cost_mae:.6f}')
          print(f'EXP32_EXP33_PRODUCTION_COST_IMPROVEMENT_721={cost_gain:.6f}%')
          print(f'EXP32_EXP33_PRODUCTION_DELAY_MAE_721={delay_mae:.6f}')
          print(f'EXP32_EXP33_PRODUCTION_DELAY_IMPROVEMENT_721={delay_gain:.6f}%')
          print(f'AFT_ELIGIBLE_PROJECTS={contract["aft_eligible_projects"]}')
          print(f'AFT_ELIGIBLE_SNAPSHOTS={contract["aft_eligible_snapshots"]}')
          print(f'FALLBACK_PROJECTS={contract["fallback_projects"]}')
          print('EXP32_EXP33_PRODUCTION_PROMOTION=VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp32-exp33-production-2001-2021
          path: |
            models/monthly_lifecycle/2001_2021/metadata.json
            models/monthly_lifecycle/2001_2021/evaluation_results.json
            models/monthly_lifecycle/2001_2021/run_manifest.json
          if-no-files-found: warn

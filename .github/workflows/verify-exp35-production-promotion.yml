name: Verify legacy Exp32+Exp33 layer

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/production_exp35_baseline.py'
      - 'backend/app/ml/experiments/exp35_aft_residual_combo.py'
      - 'tests/test_exp35_production_promotion.py'
      - 'tests/test_exp35_aft_residual_combo.py'
  workflow_dispatch:

concurrency:
  group: verify-legacy-exp35-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Verify legacy Exp32+Exp33 wrapper contracts
        run: |
          python -m py_compile backend/app/ml/production_exp35_baseline.py backend/app/ml/experiments/exp35_aft_residual_combo.py
          PYTHONPATH=. pytest -q tests/test_exp35_production_promotion.py tests/test_exp35_aft_residual_combo.py

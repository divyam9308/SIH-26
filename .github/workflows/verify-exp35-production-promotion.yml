name: Verify Exp32+Exp33 evidence-routed production promotion

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/production_exp35_baseline.py'
      - 'backend/app/ml/experiments/exp35_aft_residual_combo.py'
      - 'backend/app/services/lifecycle_retraining_service.py'
      - 'tests/test_exp35_production_promotion.py'
      - '.github/workflows/verify-exp35-production-promotion.yml'
  workflow_dispatch:

concurrency:
  group: verify-exp35-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-2001-2021:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Production wrapper contract tests
        run: PYTHONPATH=. pytest -q tests/test_exp35_production_promotion.py tests/test_exp35_aft_residual_combo.py
      - name: Retrain selected production window and verify evidence-based Delay routing
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.app.services.lifecycle_retraining_service import retrain_lifecycle
          from backend.app.ml.production_exp61_baseline import (
              PRODUCTION_COST_BASELINE,
              PRODUCTION_DELAY_BASELINE,
              PROMOTED_EXPERIMENT_ID,
          )

          result = retrain_lifecycle(2001, 2021)
          assert result['window'] == '2001_2021', result['window']
          assert result['production_cost_baseline'] == PRODUCTION_COST_BASELINE, result['production_cost_baseline']
          assert result['production_delay_baseline'] == PRODUCTION_DELAY_BASELINE, result['production_delay_baseline']
          assert result['promoted_from_experiment'] == PROMOTED_EXPERIMENT_ID, result['promoted_from_experiment']
          assert result['promoted_delay_from_experiment'] == PROMOTED_EXPERIMENT_ID, result['promoted_delay_from_experiment']

          cost_mae = float(result['metrics']['cost_model']['MAE'])
          delay_mae = float(result['metrics']['delay_model']['MAE'])
          delay_mape = float(result['metrics']['delay_model']['MAPE'])
          contract = result['metrics']['metadata']['delay_evaluation_contract']

          assert contract['cohort_rule'] == 'exp12_history_12m >= 2 then project-balanced weights', contract
          assert contract['cohort_count_policy'] == 'observed_only_no_fixed_project_or_snapshot_requirement', contract
          assert int(contract['test_projects']) >= 2, contract
          assert int(contract['test_snapshots']) >= int(contract['test_projects']), contract
          assert int(contract['routing_projects']) >= 1, contract
          assert int(contract['aft_eligible_snapshots']) <= int(contract['test_snapshots']), contract
          assert contract['fallback_policy'].startswith('Exp34 production Delay'), contract

          delay_base_routed = float(contract['base_exp34_mae_routed_projects'])
          delay_exp_routed = float(contract['promoted_exp32_exp33_mae_routed_projects'])
          delay_gain_routed = float(contract['routed_project_improvement_percentage'])

          previous_cost_mae = 26.872
          previous_delay_mae = 501.303
          assert cost_mae < previous_cost_mae, (cost_mae, previous_cost_mae)
          assert delay_exp_routed < delay_base_routed, (delay_exp_routed, delay_base_routed)
          assert delay_mae < previous_delay_mae, (delay_mae, previous_delay_mae)

          metadata = json.loads(Path('models/monthly_lifecycle/2001_2021/metadata.json').read_text())
          assert metadata['production_cost_baseline'] == PRODUCTION_COST_BASELINE, metadata['production_cost_baseline']
          assert metadata['production_delay_baseline'] == PRODUCTION_DELAY_BASELINE, metadata['production_delay_baseline']
          assert metadata['promoted_from_experiment'] == PROMOTED_EXPERIMENT_ID, metadata['promoted_from_experiment']
          assert metadata['promoted_delay_from_experiment'] == PROMOTED_EXPERIMENT_ID, metadata['promoted_delay_from_experiment']
          assert metadata['risk_policy'] == 'existing_production_retained'
          assert metadata['delay_calibration_project_count'] == contract['routing_projects']
          assert metadata['delay_evaluation_contract']['cohort_count_policy'] == 'observed_only_no_fixed_project_or_snapshot_requirement'

          cost_gain = (previous_cost_mae - cost_mae) / previous_cost_mae * 100.0
          delay_gain = (previous_delay_mae - delay_mae) / previous_delay_mae * 100.0
          fallback_snapshots = int(contract['test_snapshots']) - int(contract['aft_eligible_snapshots'])
          print(f'EXP61_PRODUCTION_COST_MAE={cost_mae:.6f}')
          print(f'EXP61_PRODUCTION_COST_IMPROVEMENT={cost_gain:.6f}%')
          print(f'EXP34_DELAY_MAE_ROUTED_PROJECTS={delay_base_routed:.6f}')
          print(f'EXP61_DELAY_MAE_ROUTED_PROJECTS={delay_exp_routed:.6f}')
          print(f'EXP61_DELAY_IMPROVEMENT_ROUTED_PROJECTS={delay_gain_routed:.6f}%')
          print(f'EXP61_PRODUCTION_DELAY_MAE={delay_mae:.6f}')
          print(f'EXP61_PRODUCTION_DELAY_MAPE_PERCENT={delay_mape:.6f}%')
          print(f'EXP61_PRODUCTION_DELAY_IMPROVEMENT={delay_gain:.6f}%')
          print(f'COMPARISON_PROJECTS={contract["test_projects"]}')
          print(f'COMPARISON_SNAPSHOTS={contract["test_snapshots"]}')
          print(f'AFT_ROUTING_PROJECTS={contract["routing_projects"]}')
          print(f'AFT_ELIGIBLE_SNAPSHOTS={contract["aft_eligible_snapshots"]}')
          print(f'FALLBACK_SNAPSHOTS={fallback_snapshots}')
          print(f'FALLBACK_ONLY_PROJECTS={contract["fallback_only_projects"]}')
          print('EXP61_EVIDENCE_ROUTER_PRODUCTION_PROMOTION=VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp32-exp33-evidence-router-production-2001-2021
          path: |
            models/monthly_lifecycle/2001_2021/metadata.json
            models/monthly_lifecycle/2001_2021/evaluation_results.json
            models/monthly_lifecycle/2001_2021/run_manifest.json
          if-no-files-found: warn

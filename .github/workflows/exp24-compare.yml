name: Experiment 24 official obstruction comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/obstruction_reasons_exp24.py'
      - 'backend/app/ml/experiments/adapter_exp24.py'
      - 'data/processed/exp24_official_obstruction_history.csv'
      - 'tests/test_exp24_obstruction_reasons.py'
      - '.github/workflows/exp24-compare.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 2001
            end: 2019
          - start: 2001
            end: 2021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Experiment 24 tests
        run: PYTHONPATH=. pytest -q tests/test_exp24_obstruction_reasons.py
      - name: Run production vs Experiment 24
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_ml_experiment.py \
            --callable backend.app.ml.experiments.adapter_exp24:run_experiment \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --test-end 2025
      - name: Print scientific verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          start='${{ matrix.start }}'; end='${{ matrix.end }}'
          r=json.loads((Path('reports/experiments/exp_24')/f'{start}_{end}'/'result.json').read_text())
          m=r['metrics']; c=r['coverage']
          print(f'WINDOW={start}_{end}')
          print(f"PRODUCTION_COST_MAE={m['production_cost_mae']:.6f}")
          print(f"EXPERIMENT_COST_MAE={m['experiment_cost_mae']:.6f}")
          print(f"COST_IMPROVEMENT_PERCENT={m['cost_improvement_percentage']:.6f}")
          print(f"PRODUCTION_DELAY_MAE={m['production_delay_mae']:.6f}")
          print(f"EXPERIMENT_DELAY_MAE={m['experiment_delay_mae']:.6f}")
          print(f"DELAY_IMPROVEMENT_PERCENT={m['delay_improvement_percentage']:.6f}")
          print(f"OFFICIAL_SOURCE_ROWS={c['official_source_rows']}")
          print(f"MATCHED_SOURCE_ROWS={c['matched_source_rows']}")
          print(f"TRAINING_PROJECTS_WITH_ASOF_REASON={c['training_projects_with_asof_reason']}")
          print(f"TEST_PROJECTS_WITH_ASOF_REASON={c['test_projects_with_asof_reason']}")
          print(f"TEST_REASON_SNAPSHOT_SHARE={c['test_reason_snapshot_share']:.6f}")
          print(f"SCIENTIFIC_STATUS={r['scientific_status']}")
          print(f"VERDICT={r['decision']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp24-${{ matrix.start }}-${{ matrix.end }}
          path: reports/experiments/exp_24/${{ matrix.start }}_${{ matrix.end }}/**
          if-no-files-found: warn

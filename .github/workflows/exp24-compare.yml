name: Experiment 24 official obstruction comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/obstruction_reasons_exp24.py'
      - 'backend/app/ml/experiments/runtime_exp24.py'
      - 'backend/app/ml/experiments/adapter_exp24.py'
      - 'data/processed/exp24_official_obstruction_history.csv'
      - 'scripts/run_fast_current_experiment.py'
      - 'tests/test_exp24_obstruction_reasons.py'
      - '.github/workflows/exp24-compare.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 2001
            end: 2019
          - start: 2001
            end: 2021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Experiment 24 tests
        run: PYTHONPATH=. pytest -q tests/test_exp24_obstruction_reasons.py
      - name: Run exact current production vs Experiment 24
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_fast_current_experiment.py \
            --experiment exp_24 \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --test-end 2025 \
            --output audit_outputs/exp24_${{ matrix.start }}_${{ matrix.end }}.json
      - name: Print scientific verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          start='${{ matrix.start }}'; end='${{ matrix.end }}'
          r=json.loads((Path('audit_outputs')/f'exp24_{start}_{end}.json').read_text())
          m=r['overall_comparison']
          print(f'WINDOW={start}_{end}')
          print(f"PRODUCTION_COST_MAE={m['production_cost_mae']:.6f}")
          print(f"EXPERIMENT_COST_MAE={m['experiment_cost_mae']:.6f}")
          print(f"COST_IMPROVEMENT_PERCENT={m['cost_improvement_percentage']:.6f}")
          print(f"PRODUCTION_DELAY_MAE={m['production_delay_mae']:.6f}")
          print(f"EXPERIMENT_DELAY_MAE={m['experiment_delay_mae']:.6f}")
          print(f"DELAY_IMPROVEMENT_PERCENT={m['delay_improvement_percentage']:.6f}")
          print(f"TRAINING_PROJECTS_WITH_ASOF_REASON={m.get('training_projects_with_asof_reason')}")
          print(f"TEST_PROJECTS_WITH_ASOF_REASON={m.get('test_projects_with_asof_reason')}")
          print(f"TEST_REASON_SNAPSHOT_SHARE={m.get('test_reason_snapshot_share')}")
          verdict='PROMOTION CANDIDATE' if m['cost_improvement_percentage'] >= 0 and m['delay_improvement_percentage'] >= 0 and (m['cost_improvement_percentage'] > 0 or m['delay_improvement_percentage'] > 0) else 'REGRESSION / DO NOT PROMOTE'
          print(f'VERDICT={verdict}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp24-${{ matrix.start }}-${{ matrix.end }}
          path: audit_outputs/exp24_${{ matrix.start }}_${{ matrix.end }}.json
          if-no-files-found: warn

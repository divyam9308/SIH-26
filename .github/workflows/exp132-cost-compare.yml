name: Exp132 Cost 2001-2021
on: {pull_request: {branches: [main]}}
jobs:
 compare:
  if: github.head_ref == 'experiment-132-scale-regime-cost'
  runs-on: ubuntu-latest
  timeout-minutes: 360
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12', cache: pip}
   - run: pip install -r requirements-dev.txt
   - run: python -m py_compile backend/app/ml/experiments/exp132_scale_regime_cost.py scripts/run_exp132_cost.py
   - env: {PYTHONPATH: '${{ github.workspace }}'}
     run: python scripts/run_exp132_cost.py --end 2021 --output audit_outputs/exp132_2001_2021.json
   - uses: actions/upload-artifact@v4
     if: always()
     with: {name: exp132-2001-2021, path: audit_outputs/exp132_2001_2021.json, if-no-files-found: warn}

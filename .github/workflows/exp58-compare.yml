name: Experiment 58 comparison - 2001-2021 only
on:
 pull_request:
  branches: [main]
  paths: ['backend/app/ml/experiments/nextgen_common.py','backend/app/ml/experiments/taxonomy_hierarchical_priors_exp58.py','backend/app/ml/experiments/adapter_exp58.py','tests/test_exp58_nextgen.py','.github/workflows/exp58-compare.yml']
 workflow_dispatch:
jobs:
 compare:
  runs-on: ubuntu-latest
  timeout-minutes: 360
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12', cache: pip}
   - run: pip install -r requirements-dev.txt
   - run: python -m py_compile backend/app/ml/experiments/nextgen_common.py backend/app/ml/experiments/taxonomy_hierarchical_priors_exp58.py backend/app/ml/experiments/adapter_exp58.py && PYTHONPATH=. pytest -q tests/test_experiment_prediction_ledger.py tests/test_exp58_nextgen.py
   - env: {PYTHONPATH: '${{ github.workspace }}'}
     run: python -m backend.app.ml.experiments.taxonomy_hierarchical_priors_exp58 --start 2001 --end 2021 --test-end 2025 --output audit_outputs/exp58_2001_2021.json
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: exp58-2001-2021
      path: |
       audit_outputs/exp58_2001_2021.json
       models/monthly_lifecycle/experiments/exp_58/2001_2021/**/*
      if-no-files-found: error

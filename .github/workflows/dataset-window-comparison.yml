name: Dataset window production MAE comparison

on:
  pull_request:
    paths:
      - 'backend/app/ml/experiments/dataset_window_comparison.py'
      - 'scripts/run_dataset_window_comparison.py'
      - 'tests/test_dataset_window_comparison.py'
      - '.github/workflows/dataset-window-comparison.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [2001_2017, 2001_2021, 2001_2022]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Focused contract tests
        run: PYTHONPATH=. pytest -q tests/test_dataset_window_comparison.py

      - name: Run current production stack for ${{ matrix.window }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_dataset_window_comparison.py --window ${{ matrix.window }}

      - name: Show MAE result
        if: always()
        run: |
          if [ -f reports/dataset_window_comparison/${{ matrix.window }}.json ]; then
            cat reports/dataset_window_comparison/${{ matrix.window }}.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset-window-${{ matrix.window }}
          path: reports/dataset_window_comparison/${{ matrix.window }}.json
          if-no-files-found: warn

  summary:
    needs: compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dataset-window-*
          path: reports/combined
          merge-multiple: true

      - name: Build combined Cost and Delay MAE table
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('reports/combined')
          rows = [json.loads(p.read_text()) for p in root.glob('*.json')]
          rows.sort(key=lambda x: x['training_end'])
          if len(rows) != 3:
              raise SystemExit(f'Expected 3 completed windows, found {len(rows)}')

          summary = {
              'comparison': 'current production main after PR #186',
              'windows': rows,
          }
          (root / 'dataset_window_mae_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          with (root / 'dataset_window_mae_summary.csv').open('w', newline='') as fh:
              writer = csv.DictWriter(
                  fh,
                  fieldnames=['label', 'training_window', 'test_window', 'cost_mae', 'delay_mae_days', 'comparison_projects', 'comparison_snapshots'],
              )
              writer.writeheader()
              for row in rows:
                  writer.writerow({key: row[key] for key in writer.fieldnames})

          print('WINDOW | COST_MAE | DELAY_MAE_DAYS')
          for row in rows:
              print(f"{row['label']} | {row['cost_mae']:.6f} | {row['delay_mae_days']:.6f}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dataset-window-mae-summary
          path: |
            reports/combined/dataset_window_mae_summary.json
            reports/combined/dataset_window_mae_summary.csv

name: Experiment 22 milestone trajectory comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/milestone_trajectory_exp22.py'
      - 'backend/app/ml/experiments/runtime_exp22.py'
      - 'backend/app/ml/experiments/adapter_exp22.py'
      - 'scripts/run_fast_current_experiment.py'
      - 'tests/test_exp22_milestone_trajectory.py'
      - '.github/workflows/exp22-compare.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 2001
            end: 2019
          - start: 2001
            end: 2021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Experiment 22 tests
        run: PYTHONPATH=. pytest -q tests/test_exp22_milestone_trajectory.py
      - name: Run exact current production vs Experiment 22
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_fast_current_experiment.py \
            --experiment exp_22 \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --test-end 2025 \
            --output audit_outputs/exp22_${{ matrix.start }}_${{ matrix.end }}.json
      - name: Print scientific verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          start='${{ matrix.start }}'; end='${{ matrix.end }}'
          r=json.loads((Path('audit_outputs')/f'exp22_{start}_{end}.json').read_text())
          m=r['overall_comparison']
          print(f'WINDOW={start}_{end}')
          print(f"PRODUCTION_COST_MAE={m['production_cost_mae']:.6f}")
          print(f"EXPERIMENT_COST_MAE={m['experiment_cost_mae']:.6f}")
          print(f"COST_IMPROVEMENT_PERCENT={m['cost_improvement_percentage']:.6f}")
          print(f"PRODUCTION_DELAY_MAE={m['production_delay_mae']:.6f}")
          print(f"EXPERIMENT_DELAY_MAE={m['experiment_delay_mae']:.6f}")
          print(f"DELAY_IMPROVEMENT_PERCENT={m['delay_improvement_percentage']:.6f}")
          print(f"TRAIN_MILESTONE_SHARE={m.get('training_milestone_snapshot_share')}")
          print(f"TEST_MILESTONE_SHARE={m.get('test_milestone_snapshot_share')}")
          verdict='PROMOTION CANDIDATE' if m['cost_improvement_percentage'] >= 0 and m['delay_improvement_percentage'] >= 0 and (m['cost_improvement_percentage'] > 0 or m['delay_improvement_percentage'] > 0) else 'REGRESSION / DO NOT PROMOTE'
          print(f'VERDICT={verdict}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp22-${{ matrix.start }}-${{ matrix.end }}
          path: audit_outputs/exp22_${{ matrix.start }}_${{ matrix.end }}.json
          if-no-files-found: warn

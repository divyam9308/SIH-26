name: Fresh 25-feature three-window audit

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Freshly train and evaluate all three windows
        run: python scripts/audit_fresh_three_window_25f.py
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-three-window-25f-audit
          path: audit_outputs/fresh_three_window_25f.json
          if-no-files-found: error

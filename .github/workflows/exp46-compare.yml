name: Experiment 46 comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/delay_local_path_exp46.py'
      - 'backend/app/ml/experiments/adapter_exp46.py'
      - 'backend/app/ml/experiments/prediction_ledger.py'
      - 'scripts/run_exp46_current_production.py'
      - 'tests/test_exp46_delay_local_path.py'
      - '.github/workflows/exp46-compare.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 2001, end: 2019}
          - {start: 2001, end: 2021}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Syntax and focused safety tests
        run: |
          python -m py_compile backend/app/ml/experiments/delay_local_path_exp46.py backend/app/ml/experiments/adapter_exp46.py scripts/run_exp46_current_production.py
          PYTHONPATH=. pytest -q tests/test_experiment_prediction_ledger.py tests/test_exp46_delay_local_path.py
      - name: Fresh production and Exp46 comparison
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python scripts/run_exp46_current_production.py
          --start ${{ matrix.start }}
          --end ${{ matrix.end }}
          --test-end 2025
          --output audit_outputs/exp46_${{ matrix.start }}_${{ matrix.end }}.json
      - name: Validate full-cohort ledger and route evidence
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          start, end = '${{ matrix.start }}', '${{ matrix.end }}'
          result = json.loads(Path(f'audit_outputs/exp46_{start}_{end}.json').read_text())
          experiment, overall = result['experiment'], result['overall_comparison']
          ledger, manifest = Path(experiment['ledger_path']), Path(experiment['ledger_manifest_path'])
          assert ledger.exists() and manifest.exists(), (ledger, manifest)
          evidence = json.loads(manifest.read_text())
          assert evidence['projects'] == overall['comparison_test_projects']
          assert evidence['snapshots'] == overall['comparison_test_snapshots']
          assert math.isclose(float(evidence['project_weight_sum_min']), 1.0, rel_tol=0.0, abs_tol=1e-6)
          assert math.isclose(float(evidence['project_weight_sum_max']), 1.0, rel_tol=0.0, abs_tol=1e-6)
          assert overall['cost_predictions_identical'] is True
          assert math.isclose(
              float(overall['fallback_route']['production_delay_mae']),
              float(overall['fallback_route']['experiment_delay_mae']),
              rel_tol=0.0,
              abs_tol=1e-9,
          )
          assert overall['aft_snapshots'] + overall['fallback_snapshots'] == overall['comparison_test_snapshots']
          print('EXP46_COHORT_FINGERPRINT=' + evidence['cohort_fingerprint'])
          print('EXP46_LEDGER_FINGERPRINT=' + evidence['ledger_fingerprint'])
          print('EXP46_LEDGER_SHA256=' + evidence['ledger_file_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp46-${{ matrix.start }}-${{ matrix.end }}
          path: |
            audit_outputs/exp46_${{ matrix.start }}_${{ matrix.end }}.json
            models/monthly_lifecycle/experiments/exp_46/${{ matrix.start }}_${{ matrix.end }}/**/prediction_ledger.csv
            models/monthly_lifecycle/experiments/exp_46/${{ matrix.start }}_${{ matrix.end }}/**/prediction_ledger_manifest.json
          if-no-files-found: error

  verdict:
    if: always()
    needs: compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exp46-*
          path: evidence
          merge-multiple: true
      - name: Emit execution and scientific verdicts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          if '${{ needs.compare.result }}' != 'success':
              print('EXP46_EXECUTION_VERDICT=EXECUTION INVALID')
              print('EXP46_SCIENTIFIC_VERDICT=DO NOT PROMOTE')
              raise SystemExit('Exp46 execution failed; inspect comparison jobs')
          rows = {}
          for end in (2019, 2021):
              path = next(Path('evidence').rglob(f'exp46_2001_{end}.json'))
              rows[end] = json.loads(path.read_text())['overall_comparison']
              item = rows[end]
              print(f'EXP46_2001_{end}_PRODUCTION_DELAY_MAE={item["production_delay_mae"]}')
              print(f'EXP46_2001_{end}_EXPERIMENT_DELAY_MAE={item["experiment_delay_mae"]}')
              print(f'EXP46_2001_{end}_DELAY_IMPROVEMENT_PERCENT={item["delay_improvement_percentage"]}')
              print(f'EXP46_2001_{end}_BOOTSTRAP_CI={item["paired_project_bootstrap"]["improvement_95pct_ci"]}')
              print(f'EXP46_AFT_PROJECTS={item["aft_projects"]}')
              print(f'EXP46_FALLBACK_PROJECTS={item["fallback_projects"]}')
          promote = all(rows[end]['delay_improvement_percentage'] > 0 for end in rows)
          print('EXP46_EXECUTION_VERDICT=EXECUTION VALID')
          print('EXP46_SCIENTIFIC_VERDICT=' + ('PROMOTION CANDIDATE' if promote else 'DO NOT PROMOTE'))
          PY

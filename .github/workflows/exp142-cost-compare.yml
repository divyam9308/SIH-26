name: Exp142 Cost canonical comparisons
on:
  pull_request:
    branches: [main]

jobs:
  unit:
    if: github.head_ref == 'experiment-142-sector-stratified-cost'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile backend/app/ml/experiments/exp142_sector_stratified_cost.py scripts/run_exp142_cost.py
      - run: pytest tests/test_exp142_sector_stratified_cost.py

  compare:
    if: github.head_ref == 'experiment-142-sector-stratified-cost'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        end: [2021, 2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run Exp142 canonical comparison
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: python scripts/run_exp142_cost.py --end ${{ matrix.end }} --output audit_outputs/exp142_2001_${{ matrix.end }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp142-2001-${{ matrix.end }}
          path: audit_outputs/exp142_2001_${{ matrix.end }}.json
          if-no-files-found: warn

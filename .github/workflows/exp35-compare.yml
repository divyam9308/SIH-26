name: Experiment 35 comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/cost_revision_hurdle_exp35.py'
      - 'backend/app/ml/experiments/adapter_exp35.py'
      - 'tests/test_exp35_cost_revision_hurdle.py'
      - '.github/workflows/exp35-compare.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 2001, end: 2019}
          - {start: 2001, end: 2021}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q tests/test_exp35_cost_revision_hurdle.py
      - name: Compare current production vs Exp35
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: >-
          python scripts/run_fast_current_experiment.py
          --experiment exp_35
          --start ${{ matrix.start }}
          --end ${{ matrix.end }}
          --test-end 2025
          --output audit_outputs/exp35_${{ matrix.start }}_${{ matrix.end }}.json
      - name: Print scientific verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s='${{ matrix.start }}'; e='${{ matrix.end }}'
          m=json.loads((Path('audit_outputs')/f'exp35_{s}_{e}.json').read_text())['overall_comparison']
          for k in ('production_cost_mae','experiment_cost_mae','cost_improvement_percentage','production_delay_mae','experiment_delay_mae','delay_improvement_percentage','comparison_test_projects','comparison_test_snapshots','decision'):
              print(f'{k.upper()}={m.get(k)}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'exp35-${{ matrix.start }}-${{ matrix.end }}'
          path: 'audit_outputs/exp35_${{ matrix.start }}_${{ matrix.end }}.json'
          if-no-files-found: warn

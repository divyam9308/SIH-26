name: Snapshot Density Cost Audit

on:
  pull_request:
    branches: [main]

jobs:
  snapshot-density-cost-audit:
    if: github.head_ref == 'audit/snapshot-density-cost'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Syntax check optimized audit runner
        run: python -m py_compile scripts/audit_snapshot_density_cost.py scripts/audit_snapshot_density_cost_fast.py
      - name: Run optimized isolated 2001-2018 snapshot-density cost audit
        env:
          PYTHONPATH: .
        run: python scripts/audit_snapshot_density_cost_fast.py --training-end 2018
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-density-cost-fast-audit-2001-2018
          path: reports/audits/snapshot_density_cost_fast_audit_2001_2018.json

name: Experiment 110-119 Delay comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/post_u1_delay_common.py'
      - 'backend/app/ml/experiments/exp11*.py'
      - 'backend/app/ml/experiments/adapter_exp11*.py'
      - 'tests/test_exp11*.py'
      - '.github/workflows/exp110-119-delay-compare.yml'

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        end: [2019, 2021]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Resolve experiment
        shell: bash
        run: |
          EXP=$(echo "${GITHUB_HEAD_REF}" | sed -n 's/^experiment-\([0-9][0-9]*\)-.*/\1/p')
          test -n "$EXP"
          test "$EXP" -ge 110
          test "$EXP" -le 119
          MODULE_FILE=$(find backend/app/ml/experiments -maxdepth 1 -type f -name "exp${EXP}_*.py" | head -n 1)
          TEST_FILE=$(find tests -maxdepth 1 -type f -name "test_exp${EXP}_*.py" | head -n 1)
          test -n "$MODULE_FILE"
          test -n "$TEST_FILE"
          MODULE=${MODULE_FILE%.py}
          MODULE=${MODULE//\//.}
          echo "EXP=$EXP" >> "$GITHUB_ENV"
          echo "MODULE_FILE=$MODULE_FILE" >> "$GITHUB_ENV"
          echo "TEST_FILE=$TEST_FILE" >> "$GITHUB_ENV"
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"
      - name: Contract tests
        run: |
          python -m py_compile backend/app/ml/experiments/post_u1_delay_common.py "$MODULE_FILE"
          PYTHONPATH=. pytest -q "$TEST_FILE"
      - name: Run isolated comparison
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          mkdir -p audit_outputs
          python -m "$MODULE" --end ${{ matrix.end }} --output "audit_outputs/exp${EXP}_2001_${{ matrix.end }}.json"
      - name: Validate evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=int('${{ matrix.end }}'); exp=os.environ['EXP']
          x=json.loads(Path(f'audit_outputs/exp{exp}_2001_{e}.json').read_text())
          assert (x['comparison_test_projects'],x['comparison_test_snapshots'])=={2019:(949,14847),2021:(721,11200)}[e]
          assert x['cost_predictions_identical']
          assert not x['holdout_used_for_selection']
          assert x['execution_verdict']=='EXECUTION VALID'
          assert x['training_end']==e
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 'exp110-119-${{ github.head_ref }}-2001-${{ matrix.end }}'
          path: 'audit_outputs/exp${{ env.EXP }}_2001_${{ matrix.end }}.json'
          if-no-files-found: error

name: Production 2022-2025 common holdout audit

on:
  push:
    branches: [audit-production-2022-2025-20260828]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        training_end: [2019, 2021]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run exact current production on common 2022-2025 holdout
        env:
          TRAINING_END: ${{ matrix.training_end }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import os
          import numpy as np
          import pandas as pd

          from backend.app.ml.experiments.trajectory_exp12_v2 import _select_target_features, _usable_features
          from backend.app.ml.feature_audit import audit_features
          from backend.app.ml.monthly_lifecycle import (
              BASELINE_FEATURES,
              CANDIDATE_FEATURES,
              as_of_feature_evidence,
              build_training_dataset,
          )
          from backend.app.ml.monthly_training import (
              _fit_pipeline,
              _regression_metrics,
              _regressors,
              _select_regressor,
          )
          from backend.app.ml.production_cost_baseline import (
              PRODUCTION_COST_BASELINE,
              PRODUCTION_COST_SEED,
              enrich_supervised_for_production,
          )

          start = 2001
          end = int(os.environ['TRAINING_END'])
          test_start = 2022
          test_end = 2025

          data, _identity = build_training_dataset()
          data = data.copy()
          data['completion_year'] = pd.to_numeric(data['completion_year'], errors='coerce')
          train = data[data.completion_year.between(start, end)].copy()

          audit = audit_features(
              train,
              CANDIDATE_FEATURES,
              minimum_availability=10,
              minimum_year_coverage=2,
              as_of_evidence=as_of_feature_evidence(CANDIDATE_FEATURES),
              leakage_risks={
                  'revised_cost_cr': 'late-stage same-snapshot signal; evaluated by production ablation',
                  'cost_escalation_percentage': 'same-snapshot revised-cost derivative; evaluated by production ablation',
              },
          )
          production_features = list(dict.fromkeys(BASELINE_FEATURES + audit['features_used']))

          cost_name, _discarded_cost, _cost_cmp = _select_regressor(
              train, production_features, 'actual_cost_overrun_percentage', 26203
          )
          delay_name, delay_model, _delay_cmp = _select_regressor(
              train, production_features, 'actual_delay_days', 26204
          )

          enriched = enrich_supervised_for_production(data.copy())
          enriched['completion_year'] = pd.to_numeric(enriched['completion_year'], errors='coerce')
          enriched_train = enriched[enriched.completion_year.between(start, end)].copy()
          usable, _trajectory_audit = _usable_features(enriched_train)
          cost_added, cost_group, _cost_feature_cmp = _select_target_features(
              enriched_train,
              production_features,
              usable,
              'actual_cost_overrun_percentage',
              cost_name,
              PRODUCTION_COST_SEED,
          )
          cost_features = list(dict.fromkeys(production_features + cost_added))
          cost_model = _fit_pipeline(
              _regressors(PRODUCTION_COST_SEED)[cost_name],
              enriched_train,
              cost_features,
              'actual_cost_overrun_percentage',
          )

          test = enriched[enriched.completion_year.between(test_start, test_end)].copy()
          overlap = set(enriched_train.canonical_project_id.dropna()) & set(test.canonical_project_id.dropna())
          if overlap:
              raise RuntimeError(f'project leakage: {len(overlap)} overlapping projects')

          cost_pred = cost_model.predict(test[cost_features])
          delay_pred = np.maximum(0, delay_model.predict(test[production_features]))
          cost = _regression_metrics(
              test.actual_cost_overrun_percentage,
              cost_pred,
              test.sample_weight,
              test.canonical_project_id,
          )
          delay = _regression_metrics(
              test.actual_delay_days,
              delay_pred,
              test.sample_weight,
              test.canonical_project_id,
          )
          result = {
              'training_window': f'{start}-{end}',
              'holdout': f'{test_start}-{test_end}',
              'production_cost_baseline': PRODUCTION_COST_BASELINE,
              'selected_cost_algorithm': cost_name,
              'selected_delay_algorithm': delay_name,
              'cost_trajectory_feature_group': cost_group,
              'cost_mae': cost['MAE'],
              'delay_mae': delay['MAE'],
              'test_projects': int(test.canonical_project_id.nunique()),
              'test_snapshots': int(len(test)),
          }
          print('PRODUCTION_COMMON_HOLDOUT=' + json.dumps(result, sort_keys=True))
          PY

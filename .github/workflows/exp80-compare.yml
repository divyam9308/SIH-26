name: Experiment 80 comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/post_u1_cost_common.py'
      - 'backend/app/ml/experiments/exp80_revision_shock_cost.py'
      - 'backend/app/ml/experiments/adapter_exp80.py'
      - 'tests/test_exp80_revision_shock_cost.py'
      - '.github/workflows/exp80-compare.yml'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        end: [2019, 2021]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile backend/app/ml/experiments/post_u1_cost_common.py backend/app/ml/experiments/exp80_revision_shock_cost.py backend/app/ml/experiments/adapter_exp80.py && PYTHONPATH=. pytest -q tests/test_exp80_revision_shock_cost.py
      - run: python -m backend.app.ml.experiments.exp80_revision_shock_cost --end ${{ matrix.end }} --output audit_outputs/exp80_2001_${{ matrix.end }}.json
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          end=int('${{ matrix.end }}');x=json.loads(Path(f'audit_outputs/exp80_2001_{end}.json').read_text());expected={2019:(949,14847),2021:(721,11200)}[end]
          assert (x['comparison_test_projects'],x['comparison_test_snapshots'])==expected
          assert x['delay_predictions_identical'] is True and x['holdout_used_for_selection'] is False
          assert x['execution_verdict']=='EXECUTION VALID'
          print(x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp80-2001-${{ matrix.end }}
          path: audit_outputs/exp80_2001_${{ matrix.end }}.json
          if-no-files-found: error

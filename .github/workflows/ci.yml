name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Python syntax check
        run: python -m compileall -q backend scripts tests
      - name: Frontend syntax check
        run: npm run build --prefix frontend
      - name: Run tests
        run: pytest -q

  experiment3-multiwindow-cost-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        training_end: [2010, 2012, 2015, 2018, 2021]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run cost audit for 2001-${{ matrix.training_end }}
        run: python scripts/audit_experiment3_window.py --training-end ${{ matrix.training_end }}
      - uses: actions/upload-artifact@v4
        with:
          name: experiment3-cost-audit-2001-${{ matrix.training_end }}
          path: reports/audits/experiment3_cost_audit_2001_${{ matrix.training_end }}.json

name: Experiment 16 GRU controlled audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/adapter_exp16.py'
      - 'backend/app/ml/experiments/gru_sequence_exp16.py'
      - 'scripts/run_exp16_gru_compare.py'
      - 'tests/test_exp16_gru_sequence.py'
      - '.github/workflows/exp16-gru-controlled-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '2001-2019'
            start: 2001
            end: 2019
          - label: '2001-2021'
            start: 2001
            end: 2021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: pip install -r requirements-dev.txt
      - name: Install CPU PyTorch for isolated neural experiment
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate Python sources
        run: python -m compileall -q backend scripts tests
      - name: Run focused neural experiment tests
        env:
          PYTHONPATH: .
        run: pytest tests/test_exp16_gru_sequence.py tests/test_exp12_trajectory.py -q
      - name: Run controlled neural temporal comparison
        env:
          PYTHONPATH: .
        run: |
          mkdir -p reports/experiments
          python scripts/run_exp16_gru_compare.py \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --output reports/experiments/exp16_gru_${{ matrix.start }}_${{ matrix.end }}.json
      - name: Upload neural evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp16-gru-audit-${{ matrix.label }}
          path: |
            reports/experiments/exp16_gru_${{ matrix.start }}_${{ matrix.end }}.json
            models/monthly_lifecycle/experiments/exp_16/**
          if-no-files-found: warn

name: Exp133 Delay 2001-2021

on:
  pull_request:
    branches: [main]

jobs:
  oof:
    if: github.head_ref == 'experiment-133-earned-schedule-delay'
    name: OOF ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2016, 2017, 2018, 2019, 2020, 2021]
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile backend/app/ml/experiments/exp133_earned_schedule_delay.py scripts/run_exp133_delay.py
      - name: Build exact strict-forward production Delay OOF fold
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: >-
          python scripts/run_exp133_delay.py
          --oof-year ${{ matrix.year }}
          --output audit_oof/delay-oof-${{ matrix.year }}.pkl
      - uses: actions/upload-artifact@v4
        with:
          name: exp133-delay-oof-${{ matrix.year }}
          path: audit_oof/delay-oof-${{ matrix.year }}.pkl
          if-no-files-found: error
          retention-days: 7

  compare:
    if: github.head_ref == 'experiment-133-earned-schedule-delay'
    name: full 2001-2021 comparison
    needs: oof
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile backend/app/ml/experiments/exp133_earned_schedule_delay.py scripts/run_exp133_delay.py
      - uses: actions/download-artifact@v4
        with:
          pattern: exp133-delay-oof-*
          path: audit_oof
          merge-multiple: true
      - name: Verify all strict OOF shards arrived
        run: |
          test -f audit_oof/delay-oof-2016.pkl
          test -f audit_oof/delay-oof-2017.pkl
          test -f audit_oof/delay-oof-2018.pkl
          test -f audit_oof/delay-oof-2019.pkl
          test -f audit_oof/delay-oof-2020.pkl
          test -f audit_oof/delay-oof-2021.pkl
      - name: Run Exp133 from exact precomputed OOF
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: >-
          python scripts/run_exp133_delay.py
          --end 2021
          --oof-dir audit_oof
          --output audit_outputs/exp133_2001_2021.json
      - name: Show result
        if: always()
        run: test ! -f audit_outputs/exp133_2001_2021.json || cat audit_outputs/exp133_2001_2021.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp133-2001-2021
          path: audit_outputs/exp133_2001_2021.json
          if-no-files-found: warn

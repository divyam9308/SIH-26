name: Experiment 73 comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/post61_common.py'
      - 'backend/app/ml/experiments/u12_u1_u10_cost_blend_exp73.py'
      - 'backend/app/ml/experiments/adapter_exp73.py'
      - 'tests/test_exp73_u1_u10_cost_blend.py'
      - '.github/workflows/exp73-compare.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        end: [2019, 2021]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Syntax and focused tests
        run: |
          python -m py_compile backend/app/ml/experiments/post61_common.py backend/app/ml/experiments/u12_u1_u10_cost_blend_exp73.py backend/app/ml/experiments/adapter_exp73.py
          PYTHONPATH=. pytest -q tests/test_exp73_u1_u10_cost_blend.py tests/test_experiment_prediction_ledger.py
      - name: Fresh production vs Exp73
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: python -m backend.app.ml.experiments.u12_u1_u10_cost_blend_exp73 --start 2001 --end ${{ matrix.end }} --test-end 2025 --output audit_outputs/exp73_2001_${{ matrix.end }}.json
      - name: Validate evidence
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          end='${{ matrix.end }}';x=json.loads(Path(f'audit_outputs/exp73_2001_{end}.json').read_text());o=x['overall_comparison'];d=x['experiment']['details']
          assert x['assumed_production']=='Exp61 (PR #96)' and x['production_artifacts_untouched'] is True
          if end=='2021': assert o['comparison_test_projects']==721 and o['comparison_test_snapshots']==11200
          assert abs(float(o['production_delay_mae'])-float(o['experiment_delay_mae'])) < 1e-12
          assert all(math.isfinite(float(o[k])) for k in ('production_cost_mae','experiment_cost_mae'))
          assert o['execution_verdict']=='EXECUTION VALID'
          assert d['holdout_used_for_weight_selection'] is False
          sel=d['selection'].get('selected_weights',d['selection'].get('fallback_weights'))
          assert float(sel['production']) >= 0.5
          print('EXP73_SELECTED_BLEND='+json.dumps(d['selection'],sort_keys=True))
          print('EXP73_SCIENTIFIC_VERDICT='+o['scientific_verdict'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp73-2001-${{ matrix.end }}
          path: |
            audit_outputs/exp73_2001_${{ matrix.end }}.json
            models/monthly_lifecycle/experiments/exp_73/**/*
          if-no-files-found: error
